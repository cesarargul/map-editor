name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Angular (ejemplo)
        run: pnpm --filter angular-demo build
      - name: Navegador para e2e
        run: pnpm --filter demo exec playwright install --with-deps chromium
      - name: Pruebas e2e
        run: pnpm e2e
